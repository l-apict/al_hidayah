<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Kas Masjid Jami' Al Hidayah</title>
    <!-- Tailwind CSS & FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Admin Header -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-sliders"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">Panel Kelola Admin</h1>
                    <p class="text-xs text-slate-400">Masjid Jami' Al Hidayah</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-slate-300 hover:text-white text-xs px-3 py-2 rounded-lg border border-slate-700 transition">
                    <i class="fa-solid fa-eye"></i> Lihat Web
                </a>
                <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Form 1: Tambah Donatur -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
                <div class="flex items-center gap-3 mb-5 border-b border-slate-100 pb-3">
                    <div class="w-8 h-8 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2 class="font-bold text-slate-700">1. Data Donatur</h2>
                </div>

                <form id="form-donatur" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nama Donatur</label>
                        <input type="text" id="nama_donatur" placeholder="H. Ahmad" required
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">No. Telepon</label>
                        <input type="text" id="no_telepon" placeholder="08123456789"
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Alamat</label>
                        <textarea id="alamat" rows="2" placeholder="Jl. Masjid No..."
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
                        Simpan Donatur
                    </button>
                </form>
            </div>

            <!-- Form 2: Input Pemasukan -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
                <div class="flex items-center gap-3 mb-5 border-b border-slate-100 pb-3">
                    <div class="w-8 h-8 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-circle-plus"></i>
                    </div>
                    <h2 class="font-bold text-slate-700">2. Input Pemasukan</h2>
                </div>

                <form id="form-pemasukan" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Tanggal</label>
                        <input type="date" id="tgl_pemasukan" required
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Donatur (Opsional)</label>
                        <select id="select-donatur" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none">
                            <option value="">-- Hamba Allah / Umum --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Keterangan</label>
                        <input type="text" id="ket_pemasukan" placeholder="Infak Shalat Jumat" required
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Jumlah (Rp)</label>
                        <input type="number" id="jml_pemasukan" placeholder="100000" required
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition">
                        Simpan Pemasukan
                    </button>
                </form>
            </div>

            <!-- Form 3: Input Pengeluaran -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
                <div class="flex items-center gap-3 mb-5 border-b border-slate-100 pb-3">
                    <div class="w-8 h-8 bg-rose-50 text-rose-600 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-circle-minus"></i>
                    </div>
                    <h2 class="font-bold text-slate-700">3. Input Pengeluaran</h2>
                </div>

                <form id="form-pengeluaran" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Tanggal</label>
                        <input type="date" id="tgl_pengeluaran" required
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Keterangan</label>
                        <input type="text" id="ket_pengeluaran" placeholder="Bayar Tagihan Listrik" required
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Jumlah (Rp)</label>
                        <input type="number" id="jml_pengeluaran" placeholder="50000" required
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none">
                    </div>
                    <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium py-2 rounded-lg text-sm transition">
                        Simpan Pengeluaran
                    </button>
                </form>
            </div>

        </div>
    </main>

    <script>
        // Check Auth
        if (sessionStorage.getItem('isAdmin') !== 'true') {
            window.location.href = 'login.html';
        }

        // Set default date
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('tgl_pemasukan').value = today;
        document.getElementById('tgl_pengeluaran').value = today;

        // Fetch Donatur List
        async function loadDonaturOptions() {
            const { data, error } = await supabase.from('donatur').select('id, nama_donatur');
            if (!error && data) {
                const select = document.getElementById('select-donatur');
                select.innerHTML = '<option value="">-- Hamba Allah / Umum --</option>';
                data.forEach(d => {
                    select.innerHTML += `<option value="${d.id}">${d.nama_donatur}</option>`;
                });
            }
        }
        loadDonaturOptions();

        // Submit Donatur
        document.getElementById('form-donatur').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabase.from('donatur').insert([{
                nama_donatur: document.getElementById('nama_donatur').value,
                no_telepon: document.getElementById('no_telepon').value,
                alamat: document.getElementById('alamat').value
            }]);

            if (error) alert('Gagal: ' + error.message);
            else {
                alert('Donatur berhasil ditambahkan!');
                document.getElementById('form-donatur').reset();
                loadDonaturOptions();
            }
        });

        // Submit Pemasukan
        document.getElementById('form-pemasukan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const donaturId = document.getElementById('select-donatur').value || null;
            const { error } = await supabase.from('pemasukan').insert([{
                tanggal: document.getElementById('tgl_pemasukan').value,
                keterangan: document.getElementById('ket_pemasukan').value,
                jumlah: document.getElementById('jml_pemasukan').value,
                id_donatur: donaturId
            }]);

            if (error) alert('Gagal: ' + error.message);
            else {
                alert('Pemasukan berhasil disimpan!');
                document.getElementById('form-pemasukan').reset();
            }
        });

        // Submit Pengeluaran
        document.getElementById('form-pengeluaran').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabase.from('pengeluaran').insert([{
                tanggal: document.getElementById('tgl_pengeluaran').value,
                keterangan: document.getElementById('ket_pengeluaran').value,
                jumlah: document.getElementById('jml_pengeluaran').value
            }]);

            if (error) alert('Gagal: ' + error.message);
            else {
                alert('Pengeluaran berhasil disimpan!');
                document.getElementById('form-pengeluaran').reset();
            }
        });

        function logout() {
            sessionStorage.removeItem('isAdmin');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
