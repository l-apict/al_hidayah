<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin - Kas Masjid</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Input Pemasukan Kas Masjid</h2>
    <form id="form-pemasukan">
        <label>Tanggal:</label><br>
        <input type="date" id="tanggal" required><br><br>

        <label>Keterangan:</label><br>
        <input type="text" id="keterangan" required><br><br>

        <label>Jumlah (Rp):</label><br>
        <input type="number" id="jumlah" required><br><br>

        <button type="submit">Simpan Data</button>
    </form>
    <br>
    <button onclick="logout()">Logout</button>

    <script>
        // Proteksi Halaman Admin
        if (sessionStorage.getItem('isAdmin') !== 'true') {
            alert('Anda harus login!');
            window.location.href = 'login.html';
        }

        const supabaseUrl = 'https://khscktqunxezfeibzotr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtoc2NrdHF1bnhlemZlaWJ6b3RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MzQ3NjgsImV4cCI6MjEwNDMxMDc2OH0.C_O1yzywEhDcTpWCUcL1EtqDGJj2NiHwgwbYLZBKrX4';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('form-pemasukan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tgl = document.getElementById('tanggal').value;
            const ket = document.getElementById('keterangan').value;
            const jml = document.getElementById('jumlah').value;

            const { data, error } = await supabase
                .from('pemasukan')
                .insert([
                    { tanggal: tgl, keterangan: ket, jumlah: jml }
                ]);

            if (error) {
                alert('Gagal menyimpan data: ' + error.message);
            } else {
                alert('Data berhasil disimpan!');
                document.getElementById('form-pemasukan').reset();
            }
        });

        function logout() {
            sessionStorage.removeItem('isAdmin');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
