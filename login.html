<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Portal - Masjid Jami' Al Hidayah</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Background Decorative Overlay -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-teal-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Main Card Container -->
    <div class="relative z-10 w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 p-6 sm:p-8 space-y-6">
        
        <!-- Header Logo & Title -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-emerald-600 text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-emerald-600/30">
                <i class="fa-solid fa-mosque text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Masjid Jami' Al Hidayah</h2>
            <p class="text-xs text-slate-500 font-medium">Silahkan pilih untuk melanjutkan</p>
        </div>

        <!-- 2 Pilihan Akses Card -->
        <div class="grid grid-cols-2 gap-3">
            <!-- Pilihan 1: Jamaah / Donatur (Langsung ke index.html) -->
            <a href="index.html" class="flex flex-col items-center justify-center p-5 rounded-2xl border-2 border-slate-200 bg-slate-50/50 hover:border-emerald-500 hover:bg-emerald-50/30 transition-all text-center group">
                <div class="w-10 h-10 rounded-xl bg-slate-200 text-slate-700 flex items-center justify-center mb-2 group-hover:bg-emerald-600 group-hover:text-white transition">
                    <i class="fa-solid fa-users text-sm"></i>
                </div>
                <span class="text-xs font-bold text-slate-800 group-hover:text-emerald-700">Jamaah / Donatur</span>
                <span class="text-[10px] text-slate-400 mt-0.5">Lihat Kas Masjid</span>
            </a>

            <!-- Pilihan 2: Pengurus Masjid (Membuka Popup Modal) -->
            <button type="button" onclick="bukaModalAdmin()" class="flex flex-col items-center justify-center p-5 rounded-2xl border-2 border-slate-200 bg-slate-50/50 hover:border-emerald-500 hover:bg-emerald-50/30 transition-all text-center group">
                <div class="w-10 h-10 rounded-xl bg-slate-200 text-slate-700 flex items-center justify-center mb-2 group-hover:bg-emerald-600 group-hover:text-white transition">
                    <i class="fa-solid fa-user-shield text-sm"></i>
                </div>
                <span class="text-xs font-bold text-slate-800 group-hover:text-emerald-700">Pengurus Masjid</span>
                <span class="text-[10px] text-slate-400 mt-0.5">Login Admin</span>
            </button>
        </div>

    </div>

    <!-- POPUP MODAL LOGIN ADMIN -->
    <div id="modal-login" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm hidden opacity-0 transition-all duration-300">
        <div class="relative w-full max-w-sm bg-white rounded-3xl shadow-2xl p-6 border border-slate-100 transform scale-95 transition-all duration-300" id="modal-box">
            
            <!-- Close Button -->
            <button type="button" onclick="tutupModalAdmin()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <!-- Modal Header -->
            <div class="text-center space-y-1 mb-5">
                <div class="w-11 h-11 bg-emerald-100 text-emerald-700 rounded-xl flex items-center justify-center mx-auto mb-2">
                    <i class="fa-solid fa-lock text-base"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900 tracking-tight">Login Pengurus</h3>
                <p class="text-xs text-slate-500">Masukkan akun pengurus untuk mengelola kas.</p>
            </div>

            <!-- Form Login -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-user text-xs"></i>
                        </span>
                        <input type="text" id="username" required placeholder="Masukkan username" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="password" required placeholder="Masukkan password" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs shadow-md transition">
                    <i class="fa-solid fa-right-to-bracket text-xs"></i>
                    <span>Masuk Portal Admin</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Script Supabase & Logic Popup -->
    <script>
        const SUPABASE_URL = 'https://khscktqunxezfeibzotr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtoc2NrdHF1bnhlemZlaWJ6b3RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MzQ3NjgsImV4cCI6MjEwNDMxMDc2OH0.C_O1yzywEhDcTpWCUcL1EtqDGJj2NiHwgwbYLZBKrX4';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const modal = document.getElementById('modal-login');
        const modalBox = document.getElementById('modal-box');

        function bukaModalAdmin() {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
                document.getElementById('username').focus();
            }, 10);
        }

        function tutupModalAdmin() {
            modal.classList.add('opacity-0');
            modalBox.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Close when clicking outside modal box
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                tutupModalAdmin();
            }
        });

        // Submit Form Login Admin
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-xs"></i> <span>Memeriksa...</span>`;

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', user)
                    .eq('password', pass)
                    .single();

                if (data) {
                    sessionStorage.setItem('isAdmin', 'true');
                    window.location.href = 'admin.html';
                } else {
                    alert('Username atau Password salah!');
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket text-xs"></i> <span>Masuk Portal Admin</span>`;
                }
            } catch (err) {
                alert('Username atau Password salah!');
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket text-xs"></i> <span>Masuk Portal Admin</span>`;
            }
        });
    </script>
</body>
</html>
